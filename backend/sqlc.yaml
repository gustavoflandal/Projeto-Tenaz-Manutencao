# Geração do código de acesso a dados.
#
# Sem ORM: o sqlc gera Go tipado a partir das migrações e das consultas .sql,
# conferido na compilação (princípio 2 da seção 1.2 de
# docs/2_ARQUITETURA_BANCO_DADOS.md).
#
# Regra que o teste de vazamento cobra: toda consulta sobre tabela de cliente
# cita empresa_id no WHERE, mesmo com RLS ligado.
#
# Dois pacotes gerados:
#   - consultas: tabelas de app, usadas só dentro de NaEmpresa, pelo pool da
#     aplicação;
#   - o repositório da autenticação: as tabelas de credencial do esquema
#     plataforma (identidade, acesso_empresa, sessao, token_renovacao,
#     codigo_autorizacao, desafio_mfa, token_email). Fica dentro de
#     autenticacao/internal, para que o compilador impeça qualquer outro pacote
#     de tocá-las, e roda num pool próprio (achado ISO-E01-02).
#
# O sqlc não percorre subpastas: cada pasta com consultas entra na lista.
# Rodado por Docker, sem instalação local:
#
#   docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.30.0 generate

version: "2"

sql:
  - engine: postgresql
    schema: db/migracoes
    queries:
      - internal/modulos/adm/internal/repo
      - internal/plataforma/autorizacao
      - internal/plataforma/auditoria
    gen:
      go: &go_comum
        package: consultas
        out: internal/plataforma/db/consultas
        sql_package: pgx/v5
        # Nomes do domínio em português, como no banco e no sumário.
        emit_json_tags: true
        json_tags_case_style: snake
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        overrides: &overrides
          # UUID com a biblioteca que o backend já usa para gerar v7.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          # Dinheiro e quantidade nunca viram float: numeric vai para um tipo
          # decimal exato (seção 1.4 do documento 2).
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/jackc/pgx/v5/pgtype.Numeric"

          # xid8: cursor de sincronização (seção 11 do documento 2).
          - db_type: "xid8"
            go_type: "uint64"

          # Instantes sempre em time.Time, em UTC (seção 1.4 do documento 2).
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          - db_type: "citext"
            go_type: "string"
          - db_type: "citext"
            nullable: true
            go_type:
              type: "string"
              pointer: true

  # O sqlc não aceita chave fora do esquema dele; as opções comuns vêm por
  # âncora do bloco acima, com o pacote e o destino trocados.
  - engine: postgresql
    schema: db/migracoes
    queries:
      - internal/plataforma/autenticacao/internal/repo
    gen:
      go:
        <<: *go_comum
        package: gerado
        out: internal/plataforma/autenticacao/internal/repo/gerado
        overrides: *overrides
