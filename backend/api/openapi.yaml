      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaLoginBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Set-Cookie:
              schema:
                description: "Cookie da sessão web: HttpOnly, SameSite=Lax, Path=/; Secure e prefixo __Host- fora do desenvolvimento"
                type:
                  - string
                  - "null"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Not Found
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Entrar com e-mail e senha
      tags:
