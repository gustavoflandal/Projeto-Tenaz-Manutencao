          type: boolean
        criado_em:
          format: date-time
          type: string
        custo_hora:
          description: "Custo por hora: preço unitário em texto decimal, com ponto, no mínimo as casas da moeda e até 6; sem sinal"
          examples:
            - "125.50"
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        escopo_acesso:
          enum:
