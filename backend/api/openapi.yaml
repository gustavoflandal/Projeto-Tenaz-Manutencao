components:
  schemas:
    Autorizacao:
      additionalProperties: false
      properties:
        uri_redirecionamento:
          description: redirect_uri com code e state (ou error=access_denied), para a web navegar até ela e o sistema entregar ao app
          type: string
      required:
        - uri_redirecionamento
      type: object
    CampoErro:
      additionalProperties: false
      properties:
        campo:
          description: Campo em notação de ponto
          examples:
            - responsavel.email
          type: string
        codigo:
          description: "Vocabulário curto: obrigatorio, valor_invalido, tamanho_maximo, tamanho_minimo, formato_invalido, fora_da_faixa, nao_encontrado, duplicado, inativo"
          examples:
            - obrigatorio
          type: string
        mensagem:
          description: O que está errado e o que fazer
          examples:
            - Informe o e-mail.
          type: string
        valores_aceitos:
          description: Valores aceitos, quando o campo é uma enumeração
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - campo
        - codigo
        - mensagem
      type: object
    CapturaAuditoria:
      additionalProperties: false
      properties:
        configurada:
          description: "Falso: a empresa ainda não mudou nenhuma chave desta tela e vale o padrão (impressão e extração ligadas, visualização desligada)"
          type: boolean
        extracao:
          description: Grava a extração (lista, relatório, exportação) feita nesta tela
          type: boolean
        impressao:
          description: Grava a impressão (PDF ou tela) feita nesta tela
          type: boolean
        modulo:
          examples:
            - adm
          type: string
        nome:
          examples:
            - Pessoas
          type: string
        tela:
          description: <modulo>.<tela> do catálogo fechado
          examples:
            - adm.pessoas
          type: string
        visualizacao:
          description: Grava um evento por registro aberto nesta tela
          type: boolean
      required:
        - tela
        - modulo
        - nome
        - visualizacao
        - impressao
        - extracao
        - configurada
      type: object
    ConfiguracaoMFA:
      additionalProperties: false
      properties:
        segredo_base32:
          description: Segredo para digitar no aplicativo autenticador
          type: string
        uri_otpauth:
          description: URI otpauth:// para o QR code
          type: string
      required:
        - segredo_base32
        - uri_otpauth
      type: object
    ContaCriada:
      additionalProperties: false
      properties:
        convite_enviado:
          description: "Falso: a conta existe, mas o e-mail do convite não saiu; peça o reenvio ao suporte"
          type: boolean
      required:
        - convite_enviado
      type: object
    Convite:
      additionalProperties: false
      properties:
        email:
          description: E-mail convidado
          type: string
        pede_senha:
          description: "Verdadeiro: o e-mail ainda não tem login e a tela pede a senha nova; falso: entra com a senha que já tem"
          type: boolean
      required:
        - email
        - pede_senha
      type: object
    ConviteAceito:
      additionalProperties: false
      properties:
        identidade_nova:
          description: "Falso: o e-mail já entrava em outra empresa e usa a senha que tem"
          type: boolean
      required:
        - identidade_nova
      type: object
    DiaVerificado:
      additionalProperties: false
      properties:
        dia:
          description: Dia UTC
          format: date
          type: string
        estado:
          enum:
            - integro
            - violado
            - nao_selado
          type: string
        evento_id:
          description: Primeiro evento alterado, quando há como apontar
          format: uuid
          type: string
        motivo:
          description: "Em violado: evento_alterado, eventos_divergentes, selo_adulterado, cadeia_quebrada, selo_ausente, evento_anterior_ao_primeiro_selo, copia_ausente ou copia_divergente. Em nao_selado: ainda_nao_selado ou anterior_ao_primeiro_selo"
          type:
            - string
            - "null"
      required:
        - dia
        - estado
        - motivo
        - evento_id
      type: object
    Empresa:
      additionalProperties: false
      properties:
        atualizado_em:
          format: date-time
          type: string
        criado_em:
          format: date-time
          type: string
        fuso_horario:
          examples:
            - America/Sao_Paulo
          type: string
        id:
          format: uuid
          type: string
        identificacao:
          description: "Normalizada: maiúsculas, só letras e dígitos, sem máscara"
          type:
            - string
            - "null"
        identificacao_tipo:
          description: cnpj no BR, cuit na AR, ruc no PY
          type:
            - string
            - "null"
        idioma_padrao:
          description: Idioma que o usuário convidado recebe; cada usuário muda o seu em PATCH /v1/usuarios/eu
          enum:
            - pt-BR
            - es-419
          type: string
        mfa_obrigatorio:
          description: "Segundo fator exigido de todos os usuários (RN-ADM-027): quem não o tem entra com sessão restrita à ativação"
          type: boolean
        moeda:
          description: Moeda da empresa, dada pelo país; só leitura
          enum:
            - BRL
            - ARS
            - PYG
          type: string
        nome_fantasia:
          type:
            - string
            - "null"
        pais:
          description: Define a moeda, o idioma padrão sugerido e o tipo de identificação; só leitura depois da criação da conta
          enum:
            - BR
            - AR
            - PY
          type: string
        plano:
          description: essencial, profissional ou enterprise; nulo na conta só do plano Serviços
          type:
            - string
            - "null"
        razao_social:
          type: string
        retencao_auditoria_anos:
          format: int32
          type: integer
        situacao:
          enum:
            - teste
            - ativa
            - suspensa
            - cancelada
          type: string
        srv_habilitado:
          type: boolean
        teste_ate:
          format: date
          type:
            - string
            - "null"
        versao:
          format: int64
          type: integer
      required:
        - id
        - razao_social
        - nome_fantasia
        - pais
        - moeda
        - idioma_padrao
        - identificacao_tipo
        - identificacao
        - plano
        - srv_habilitado
        - mfa_obrigatorio
        - situacao
        - fuso_horario
        - retencao_auditoria_anos
        - teste_ate
        - versao
        - criado_em
        - atualizado_em
      type: object
    EmpresaAcesso:
      additionalProperties: false
      properties:
        atual:
          description: Empresa da credencial atual
          type: boolean
        id:
          description: Identificador para empresa_escolhida_id
          format: uuid
          type: string
        nome:
          type: string
      required:
        - id
        - nome
        - atual
      type: object
    EmpresaSessao:
      additionalProperties: false
      properties:
        idioma_padrao:
          description: Idioma padrão da empresa (empresa.idioma_padrao)
          enum:
            - pt-BR
            - es-419
          type: string
        moeda:
          description: Moeda da empresa, dada pelo país; só leitura
          enum:
            - BRL
            - ARS
            - PYG
          type: string
        nome:
          type: string
        pais:
          description: País da empresa (ISO 3166-1 alfa-2); só leitura
          enum:
            - BR
            - AR
            - PY
          type: string
        plano:
          description: Nulo na conta só do plano Serviços
          enum:
            - essencial
            - profissional
            - enterprise
          type:
            - string
            - "null"
        srv_habilitado:
          description: Módulo SRV habilitado (conta de subcontratada)
          type: boolean
      required:
        - nome
        - plano
        - srv_habilitado
        - pais
        - moeda
        - idioma_padrao
      type: object
    Endereco:
      additionalProperties: false
      properties:
        bairro:
          maxLength: 100
          type: string
        codigo_postal:
          description: CEP (BR), CPA ou código de 4 dígitos (AR), 6 dígitos (PY); recebido com ou sem máscara, devolvido normalizado
          maxLength: 16
          type: string
        complemento:
          maxLength: 100
          type: string
        logradouro:
          maxLength: 200
          type: string
        municipio:
          maxLength: 100
          type: string
        numero:
          maxLength: 20
          type: string
        subdivisao:
          description: Código ISO 3166-2 do país da empresa (BR-SP, AR-C, PY-ASU)
          maxLength: 6
          type: string
      type: object
    EntradaAutorizarPOSTBody:
      additionalProperties: false
      properties:
        client_id:
          maxLength: 64
          type: string
        code_challenge:
          maxLength: 128
          type: string
        code_challenge_method:
          enum:
            - S256
          type: string
        empresa_escolhida_id:
          description: Empresa da sessão do app, entre as de GET /v1/auth/sessao
          format: uuid
          type: string
        redirect_uri:
          maxLength: 512
          type: string
        response_type:
          enum:
            - code
          type: string
        state:
          maxLength: 512
          type: string
      required:
        - response_type
        - client_id
        - redirect_uri
        - code_challenge
        - code_challenge_method
        - empresa_escolhida_id
      type: object
    EntradaCapturaAuditoria:
      additionalProperties: false
      properties:
        extracao:
          type: boolean
        impressao:
          type: boolean
        visualizacao:
          type: boolean
      required:
        - visualizacao
        - impressao
        - extracao
      type: object
    EntradaCodigoMFABody:
      additionalProperties: false
      properties:
        codigo:
          pattern: ^[0-9]{6}$
          type: string
      required:
        - codigo
      type: object
    EntradaConviteAceitarBody:
      additionalProperties: false
      properties:
        idioma:
          description: "Idioma em que a pessoa aceitou; passa a ser o dela. Ausente: o do convite (padrão da empresa)"
          enum:
            - pt-BR
            - es-419
          type: string
        senha:
          description: Obrigatória quando pede_senha; ignorada quando o e-mail já tem login
          maxLength: 1024
          type: string
        token:
          maxLength: 43
          minLength: 43
          type: string
      required:
        - token
      type: object
    EntradaConviteConsultarBody:
      additionalProperties: false
      properties:
        token:
          description: "Token do link do convite, lido do fragmento #token="
          maxLength: 43
          minLength: 43
          type: string
      required:
        - token
      type: object
    EntradaFeriado:
      additionalProperties: false
      properties:
        data:
          format: date
          type: string
        descricao:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - data
        - descricao
      type: object
    EntradaLoginBody:
      additionalProperties: false
      properties:
        email:
          description: E-mail do login
          maxLength: 254
          type: string
        empresa_escolhida_id:
          description: "Empresa da sessão, entre as da pessoa; ausente: a da última sessão"
          format: uuid
          type: string
        senha:
          maxLength: 1024
          type: string
      required:
        - email
        - senha
      type: object
    EntradaMFABody:
      additionalProperties: false
      properties:
        codigo:
          description: Código de 6 dígitos do aplicativo autenticador
          pattern: ^[0-9]{6}$
          type: string
        desafio_id:
          description: desafio_id da resposta 401 mfa_obrigatorio
          maxLength: 43
          minLength: 43
          type: string
        empresa_escolhida_id:
          format: uuid
          type: string
      required:
        - desafio_id
        - codigo
      type: object
    EntradaPermissao:
      additionalProperties: false
      properties:
        permissao:
          description: Código do catálogo de RF-ADM-005
          examples:
            - os.encerrar
          maxLength: 60
          type: string
      required:
        - permissao
      type: object
    EntradaPessoa:
      additionalProperties: false
      properties:
        cargo:
          maxLength: 100
          type: string
        data_nascimento:
          format: date
          type: string
        email:
          maxLength: 254
          type: string
        fornecedor_id:
          format: uuid
          type: string
        identificacao:
          description: Com ou sem máscara; a forma e, no CPF, o dígito verificador são conferidos
          maxLength: 24
          type: string
        identificacao_tipo:
          description: Qualquer país suportado; vai junto com identificacao
          enum:
            - cpf
            - cuil
            - dni
            - ci
          type: string
        matricula:
          maxLength: 40
          type: string
        nome:
          maxLength: 200
          minLength: 1
          type: string
        registro_profissional:
          maxLength: 60
          type: string
        telefone:
          maxLength: 30
          type: string
        unidade_id:
          format: uuid
          type: string
        vinculo:
          description: "Ausente: empregado"
          enum:
            - empregado
            - terceiro
            - autonomo
          type: string
      required:
        - nome
      type: object
    EntradaRecuperarSenhaBody:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          type: string
      required:
        - email
      type: object
    EntradaRedefinirSenhaBody:
      additionalProperties: false
      properties:
        nova_senha:
          maxLength: 1024
          type: string
        token:
          description: "Token do link do e-mail, lido do fragmento #token="
          maxLength: 43
          minLength: 43
          type: string
      required:
        - token
        - nova_senha
      type: object
    EntradaRevogarBody:
      additionalProperties: false
      properties:
        client_id:
          maxLength: 64
          type: string
        token:
          maxLength: 128
          type: string
        token_type_hint:
          enum:
            - refresh_token
          type: string
      required:
        - token
      type: object
    EntradaTokenBody:
      additionalProperties: false
      properties:
        client_id:
          maxLength: 64
          type: string
        code:
          maxLength: 64
          type: string
        code_verifier:
          maxLength: 128
          type: string
        grant_type:
          enum:
            - authorization_code
            - refresh_token
          type: string
        redirect_uri:
          maxLength: 512
          type: string
        refresh_token:
          maxLength: 128
          type: string
      required:
        - grant_type
        - client_id
      type: object
    EntradaTrocarEmpresaBody:
      additionalProperties: false
      properties:
        empresa_escolhida_id:
          description: Empresa de destino, entre as de GET /v1/auth/sessao
          format: uuid
          type: string
      required:
        - empresa_escolhida_id
      type: object
    EntradaTrocarSenhaBody:
      additionalProperties: false
      properties:
        nova_senha:
          maxLength: 1024
          type: string
        senha_atual:
          maxLength: 1024
          type: string
      required:
        - senha_atual
        - nova_senha
      type: object
    EntradaTurno:
      additionalProperties: false
      properties:
        dia_semana:
          description: 1 = segunda ... 7 = domingo
          format: int32
          maximum: 7
          minimum: 1
          type: integer
        hora_fim:
          examples:
            - "17:00"
          maxLength: 5
          type: string
        hora_inicio:
          examples:
            - "08:00"
          maxLength: 5
          type: string
        nome:
          maxLength: 60
          type: string
      required:
        - dia_semana
        - hora_inicio
        - hora_fim
      type: object
    EntradaUnidade:
      additionalProperties: false
      properties:
        codigo:
          maxLength: 20
          minLength: 1
          type: string
        endereco:
          $ref: "#/components/schemas/Endereco"
        fuso_horario:
          maxLength: 64
          type: string
        identificacao:
          maxLength: 24
          type: string
        identificacao_tipo:
          description: Só o tipo do país da empresa; vai junto com identificacao
          enum:
            - cnpj
            - cuit
            - ruc
          type: string
        latitude:
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        nome:
          maxLength: 200
          minLength: 1
          type: string
        turnos:
          description: Só na criação; depois, pelas rotas de turno. Obrigatório em POST /v1/unidades; no cadastro da conta, ausente vale segunda a sexta das 08:00 às 17:00
          items:
            $ref: "#/components/schemas/EntradaTurno"
          maxItems: 70
          type:
            - array
            - "null"
      required:
        - codigo
        - nome
      type: object
    EntradaUsuario:
      additionalProperties: false
      properties:
        custo_hora:
          description: Preço unitário em texto decimal, até 6 casas, sem sinal; recusado, sem arredondar, o que a moeda da empresa não representa
          examples:
            - "125.50"
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
          type: string
        email:
          maxLength: 254
          type: string
        fornecedor_id:
          description: Obrigatório no perfil prestador
          format: uuid
          type: string
        locatario_id:
          description: Obrigatório no perfil locatario
          format: uuid
          type: string
        nome:
          maxLength: 200
          minLength: 1
          type: string
        nova_pessoa:
          $ref: "#/components/schemas/EntradaPessoa"
          description: Cria a pessoa junto; não use junto com pessoa_id
        perfis:
          description: "Códigos dos perfis: administrador, gestor, tecnico..."
          items:
            type: string
          maxItems: 12
          minItems: 1
          type:
            - array
            - "null"
        pessoa_id:
          description: Liga a uma pessoa existente; não use junto com nova_pessoa
          format: uuid
          type: string
        telefone:
          maxLength: 30
          type: string
        unidade_padrao_id:
          format: uuid
          type: string
      required:
        - nome
        - email
        - perfis
      type: object
    Evento:
      additionalProperties: false
      properties:
        acao:
          description: Tipo de operação (lista fechada, sumário 3.6)
          enum:
            - login
            - logout
            - inclusao
            - alteracao
            - exclusao
            - delecao
            - visualizacao
            - impressao
            - extracao
          type: string
        antes:
          description: Valores antes da alteração; nulo na criação
        ator_tipo:
          enum:
            - usuario
            - sistema
            - integracao
            - suporte_tenaz
            - link_execucao
            - sincronizacao_conexao
          type: string
        campos_alterados:
          items:
            type: string
          type:
            - array
            - "null"
        conexao_empresa_id:
          format: uuid
          type: string
        depois:
          description: Valores depois da alteração; nulo na exclusão. Na falha de login, traz o motivo
        detalhe:
          description: Filtros, formato e quantidade de uma impressão ou extração; nunca o conteúdo mostrado
        dispositivo_id:
          format: uuid
          type: string
        entidade:
          type: string
        entidade_chave:
          type:
            - string
            - "null"
        entidade_id:
          format: uuid
          type: string
        hash:
          description: sha256, em hexadecimal, do conteúdo do evento (formato 1, documento 2, seção 9.2.1)
          pattern: ^[0-9a-f]{64}$
          type: string
        id:
          format: uuid
          type: string
        ip:
          type:
            - string
            - "null"
        modulo:
          description: Código do módulo (sumário, seção 2), em minúsculas
          type:
            - string
            - "null"
        ocorrido_em:
          format: date-time
          type: string
        ocorrido_no_dispositivo_em:
          format: date-time
          type:
            - string
            - "null"
        origem:
          enum:
            - web
            - app
            - api
            - job
            - importacao
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
        resultado:
          description: falha só em login; o motivo está em depois do detalhe do evento
          enum:
            - sucesso
            - falha
          type: string
        sensivel:
          description: O registro mostrado, impresso ou extraído tem dado sensível
          type: boolean
        tela:
          description: Tela de origem, <modulo>.<tela> do catálogo fechado; nula em API, job e sincronização
          type:
            - string
            - "null"
        token_api_id:
          format: uuid
          type: string
        user_agent:
          type:
            - string
            - "null"
        usuario_id:
          format: uuid
          type: string
        usuario_nome:
          description: Nome do usuário no instante do evento; a troca de nome não reescreve o histórico
          type:
            - string
            - "null"
      required:
        - antes
        - depois
        - detalhe
        - hash
        - user_agent
        - id
        - ocorrido_em
        - ator_tipo
        - usuario_id
        - usuario_nome
        - token_api_id
        - acao
        - resultado
        - entidade
        - entidade_id
        - entidade_chave
        - campos_alterados
        - modulo
        - tela
        - sensivel
        - origem
        - ip
        - dispositivo_id
        - request_id
        - conexao_empresa_id
        - ocorrido_no_dispositivo_em
      type: object
    Feriado:
      additionalProperties: false
      properties:
        data:
          format: date
          type: string
        descricao:
          type: string
        id:
          format: uuid
          type: string
        unidade_id:
          format: uuid
          type: string
        versao:
          format: int64
          type: integer
      required:
        - id
        - unidade_id
        - data
        - descricao
        - versao
      type: object
    ListaCapturaAuditoria:
      additionalProperties: false
      properties:
        dados:
          items:
            $ref: "#/components/schemas/CapturaAuditoria"
          type:
            - array
            - "null"
        paginacao:
          $ref: "#/components/schemas/Paginacao"
      required:
        - dados
        - paginacao
      type: object
    ListaDiaVerificado:
      additionalProperties: false
      properties:
        dados:
          items:
            $ref: "#/components/schemas/DiaVerificado"
          type:
            - array
            - "null"
        paginacao:
          $ref: "#/components/schemas/Paginacao"
      required:
        - dados
        - paginacao
      type: object
    ListaFeriado:
      additionalProperties: false
      properties:
        dados:
          items:
            $ref: "#/components/schemas/Feriado"
          type:
            - array
            - "null"
        paginacao:
          $ref: "#/components/schemas/Paginacao"
      required:
        - dados
        - paginacao
      type: object
    ListaPerfil:
      additionalProperties: false
      properties:
        dados:
          items:
            $ref: "#/components/schemas/Perfil"
          type:
            - array
            - "null"
        paginacao:
          $ref: "#/components/schemas/Paginacao"
      required:
