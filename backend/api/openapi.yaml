  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token do app de campo, emitido por POST /oauth/token (seção 4.3 do documento 3).
      scheme: bearer
      type: http
    sessao:
      description: Sessão web (seção 4.2 do documento 3). Métodos que alteram dados exigem também o cabeçalho X-CSRF-Token e Origin de uma origem da web.
      in: cookie
      name: __Host-tenaz_sessao
      type: apiKey
info:
  description: API da Tenaz — Gestão de Manutenção e Frota. Contrato único usado pela web, pelo aplicativo de campo e pelos integradores.
  title: Tenaz
  version: "1"
openapi: 3.1.0
paths:
  /oauth/authorize:
    get:
      description: Confere client_id e redirect_uri e redireciona (302) para a tela de autorização da web, /autorizar-app, com os mesmos parâmetros. Lá a pessoa entra com a sessão web normal (senha e MFA), escolhe a empresa e a web chama POST /oauth/authorize. Cliente ou URI de retorno inválidos respondem 422 e nunca redirecionam.
      operationId: iniciarAutorizacaoApp
      parameters:
        - explode: false
          in: query
          name: response_type
          required: true
          schema:
            enum:
              - code
            type: string
        - explode: false
          in: query
          name: client_id
          required: true
          schema:
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: redirect_uri
          required: true
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: code_challenge
          required: true
          schema:
            maxLength: 128
            type: string
        - explode: false
          in: query
          name: code_challenge_method
          required: true
          schema:
            enum:
              - S256
            type: string
        - explode: false
          in: query
          name: state
          schema:
            maxLength: 512
            type: string
      responses:
        "302":
          description: Found
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Início do OAuth 2.1 com PKCE do app
      tags:
        - OAuth do app
      x-escopos-acesso:
        - publico
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
    post:
      description: "Chamada pela tela /autorizar-app da web, com a sessão web (cookie, X-CSRF-Token e Origin). Emite o código de uso único (60 s) e devolve a redirect_uri com code e state. Perfil sem mob.usar_app (o locatario) recebe a redirect_uri com error=access_denied. Empresa fora do acesso: 404."
      operationId: autorizarApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaAutorizarPOSTBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autorizacao"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security:
        - sessao: []
      summary: Autorizar o app na empresa escolhida
      tags:
        - OAuth do app
      x-escopos-acesso:
        - interno
        - prestador
        - locatario
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
  /oauth/revoke:
    post:
      description: "RFC 7009: revoga a família de refresh tokens e a sessão do aparelho. O refresh token no corpo é a credencial. Token desconhecido também responde 200, para não servir de oráculo."
      operationId: revogarTokenApp
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EntradaRevogarBody"
        required: true
      responses:
        "200":
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Revogar o refresh token (sair no app)
      tags:
        - OAuth do app
      x-escopos-acesso:
        - publico
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
  /oauth/token:
    post:
      description: "grant_type=authorization_code (code, redirect_uri, client_id, code_verifier) ou grant_type=refresh_token (refresh_token, client_id). Cada renovação devolve refresh token novo; um refresh token já usado e reapresentado revoga a família e a sessão do aparelho. Falha: 401 credencial_invalida com error=invalid_grant (RFC 6749). O app serializa as renovações."
      operationId: emitirTokensApp
      parameters:
        - description: Dispositivo do app, gravado na sessão
          in: header
          name: X-Tenaz-Dispositivo-Id
          schema:
            description: Dispositivo do app, gravado na sessão
            format: uuid
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EntradaTokenBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensApp"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Pragma:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Trocar o código ou renovar o refresh token
      tags:
        - OAuth do app
      x-escopos-acesso:
        - publico
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
  /v1/auth/convites/aceitar:
    post:
      description: Liga o login ao usuário convidado e o ativa; o link é gasto. Depois, a pessoa entra por POST /v1/auth/login. 410 link_email_invalido; 422 senha_fraca; 409 conflito se o e-mail já tem usuário na empresa.
      operationId: aceitarConvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaConviteAceitarBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConviteAceito"
          description: OK
          headers:
            ETag:
              schema:
                type:
                  - string
                  - "null"
            Location:
              schema:
                type:
                  - string
                  - "null"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Aceitar o convite
      tags:
        - ADM — Administração
      x-escopos-acesso:
        - publico
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
  /v1/auth/convites/consultar:
    post:
      description: Confere o link sem gastá-lo, para a tela de aceite saber se pede senha. O token vai no corpo, nunca na URL. 410 link_email_invalido.
      operationId: consultarConvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntradaConviteConsultarBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convite"
          description: OK
          headers:
            ETag:
              schema:
                type:
                  - string
                  - "null"
            Location:
              schema:
                type:
                  - string
                  - "null"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
          description: Internal Server Error
      security: []
      summary: Consultar o convite do link
      tags:
        - ADM — Administração
      x-escopos-acesso:
        - publico
      x-fase: MVP
      x-modulo: ADM
      x-plano-minimo: E
  /v1/auth/login:
    post:
      description: Cria a sessão web e devolve o cookie de sessão e o csrf_token. Com MFA ativo, responde 401 mfa_obrigatorio com desafio_id, e o login termina em POST /v1/auth/mfa/verificar. Toda falha de credencial responde 401 credencial_invalida, sem dizer se o e-mail existe (RF-ADM-006).
